# Second-tier universe (CIKs 1000-1999) for cross-universe robustness test.
# Same SEC + yfinance config as the original 1000-CIK run.

includes:
  - default.yaml

features:
  periods_back: 8
  min_company_count: 50
  min_sample_coverage_pct: 1.0
  max_missing_pct: 99.0

model:
  type: lightgbm
  splits:
    train_end_date: "2015-12-31"
    validation_end_date: "2019-12-31"
    test_start_date: "2020-01-01"

target:
  k: 2.5
  scale:
    method: hybrid_daily_event
    daily_vol_lookback_days: 252
    event_vol_lookback_events: 8
    min_event_history: 4

backtest:
  start_date: "2020-01-02"
  end_date: null
