# Even safer: N=75, tighter sector cap, signal threshold, lower per-name cap.
includes:
  - default.yaml

features: {periods_back: 8, min_company_count: 50}
model: {type: ridge}
target: {k: 2.5}
backtest: {start_date: "2020-01-02", end_date: null}

portfolio:
  signal:
    min_positive_signal: 0.20
  positions:
    min_positions: 30
    target_positions: 75
    max_positions: 100
    max_single_stock_weight: 0.03
    min_position_weight: 0.001
  sector:
    use_sector_caps: true
    max_sector_weight: 0.22
