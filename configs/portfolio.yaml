portfolio:
  long_only: true
  allow_cash: true
  leverage: 1.0

  signal:
    min_positive_signal: 0.05
    use_restored_return_for_sorting: false
    signal_power: 1.0
    restore_clip_abs: 0.99
    k: 2.5

  positions:
    min_positions: 30
    target_positions: 50
    max_positions: 100
    max_single_stock_weight: 0.05
    min_position_weight: 0.0025

  risk:
    allocation_method: inverse_vol  # inverse_vol | risk_parity
    risk_lookback_days: 252
    min_daily_vol: 0.005
    max_daily_vol: 0.10
    covariance_shrinkage_lambda: 0.5

  sector:
    use_sector_caps: false
    max_sector_weight: 0.30

  rebalance:
    frequency: daily_event_driven   # daily_event_driven | weekly
    execution_price: same_day_close

  costs:
    transaction_cost_bps_per_trade: 10
    cash_return: 0.0
