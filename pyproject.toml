[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymous-fundamental-portfolio"
version = "0.1.0"
description = "Event-driven US equity research using anonymous fundamental features."
requires-python = ">=3.10"
authors = [{ name = "Jason" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "requests>=2.31",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
gbt = ["lightgbm>=4.0"]
neural = ["torch>=2.1"]
prices = ["yfinance>=0.2.40"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]

[project.scripts]
afp = "afp.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
